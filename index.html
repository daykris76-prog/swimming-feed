<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>TTS Swimming Dashboard | High Performance Swimmer Analytics</title>

  <!-- iOS Native Web App & PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TTS Swim">
  <meta name="theme-color" content="#070d17">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/06b6d4/ffffff?text=TTS+Swim">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Tesseract.js CDN for in-browser OCR screenshot parsing -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" defer></script>

  <!-- Font Awesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">

  <script>
    window.EMBEDDED_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBpkCLBODMYa9d5fy13f5yLDfc9A-eS230",
      authDomain: "swim-app-2b43e.firebaseapp.com",
      projectId: "swim-app-2b43e",
      storageBucket: "swim-app-2b43e.firebasestorage.app",
      messagingSenderId: "322364272419",
      appId: "1:322364272419:web:f74e2c890cb45e6fbae696"
    };

    window.cloudSyncTimer = null;
    window.updateCloudStatusUI = function(state, customLabel) {
      const dot = document.getElementById('cloud-status-dot');
      const text = document.getElementById('cloud-status-text');
      const pill = document.getElementById('cloud-status-pill');
      if (!dot || !text || !pill) return;

      if (state === 'connected') {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse';
        text.textContent = customLabel || 'Live Cloud Sync';
        pill.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-950/60 text-emerald-300 border border-emerald-700/50';
      } else if (state === 'syncing') {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping';
        text.textContent = customLabel || 'Syncing...';
        pill.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-cyan-950/60 text-cyan-300 border border-cyan-700/50';
      } else {
        dot.className = 'w-1.5 h-1.5 rounded-full bg-amber-400';
        text.textContent = customLabel || 'Local Sync Ready';
        pill.className = 'inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700';
      }
    };

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            midnight: '#070d17',
            navy: {
              800: '#0f172a',
              850: '#0b1324',
              900: '#060e1e',
            },
            cyan: {
              400: '#22d3ee',
              500: '#06b6d4',
              DEFAULT: '#00d2ff',
            },
            gold: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
              DEFAULT: '#f59e0b',
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: radial-gradient(circle at 15% 15%, #0f233d 0%, #080f1d 45%, #040811 100%);
      min-height: 100vh;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: calc(env(safe-area-inset-bottom) + 3rem);
    }
    
    .glass-card {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #080f1d;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }

    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .glass-card {
        background: #ffffff !important;
        color: #000000 !important;
        border: 1px solid #cbd5e1 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="font-sans antialiased selection:bg-cyan-500 selection:text-black">

  <!-- TOP NAVIGATION HEADER & SWIMMER SELECTOR -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-midnight/90 backdrop-blur-xl no-print">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 space-y-2.5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-midnight font-black text-base shadow-lg shadow-cyan-500/25">
            <i class="fa-solid fa-person-swimming"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="font-display font-black text-white text-base sm:text-lg tracking-tight leading-none">
                TTS <span class="text-cyan-400">SWIM</span> ANALYTICS
              </h1>
              <span id="cloud-status-pill" class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-800 text-slate-300 border border-slate-700">
                <span id="cloud-status-dot" class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                <span id="cloud-status-text">Local Sync Ready</span>
              </span>
            </div>
            <p class="text-[11px] text-slate-400 hidden sm:block mt-0.5">High-Performance Age-Group Pacing, OCR &amp; AI Biomechanics</p>
          </div>
        </div>

        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
          <button onclick="openAddSwimmerModal()" class="px-3 py-1.5 rounded-xl bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/40 font-bold text-xs flex items-center gap-1.5 transition shadow-sm">
            <i class="fa-solid fa-user-plus"></i>
            <span>Add Swimmer</span>
          </button>

          <button onclick="openScanModal()" class="px-3 py-1.5 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 text-cyan-300 border border-cyan-500/40 font-bold text-xs flex items-center gap-1.5 transition shadow-sm">
            <i class="fa-solid fa-images"></i>
            <span>Screenshots</span>
          </button>

          <button onclick="openVideoModal()" class="px-3 py-1.5 rounded-xl bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-midnight font-extrabold text-xs flex items-center gap-1.5 transition shadow-md shadow-amber-500/20">
            <i class="fa-solid fa-video"></i>
            <span>Upload Video</span>
          </button>

          <button onclick="openRosterModal()" title="TTS Club &amp; Family Roster" class="w-8 h-8 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 flex items-center justify-center text-xs transition">
            <i class="fa-solid fa-users"></i>
          </button>

          <button onclick="openAuditModal()" title="Activity Tracker &amp; Audit Log" class="relative w-8 h-8 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-indigo-300 hover:text-white border border-slate-700 flex items-center justify-center text-xs transition">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span id="audit-badge-count" class="absolute -top-1.5 -right-1.5 px-1 min-w-[16px] h-4 rounded-full bg-indigo-500 text-white font-mono text-[9px] font-bold flex items-center justify-center">0</span>
          </button>

          <button onclick="openInstallModal()" title="Install iPhone Home Screen App" class="w-8 h-8 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 hover:text-white border border-slate-700 flex items-center justify-center text-sm transition">
            <i class="fa-brands fa-apple"></i>
          </button>

          <button onclick="openDataBackupModal()" title="Cloud Sync Settings &amp; JSON Backup" class="w-8 h-8 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 flex items-center justify-center text-xs transition">
            <i class="fa-solid fa-database"></i>
          </button>

          <button onclick="window.print()" title="Print / Save PDF Report" class="w-8 h-8 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-300 hover:text-white border border-slate-700 flex items-center justify-center text-xs transition">
            <i class="fa-solid fa-print"></i>
          </button>
        </div>
      </div>

      <div id="swimmer-tabs-bar" class="flex items-center gap-1.5 overflow-x-auto pb-1"></div>
    </div>
  </header>

  <!-- MAIN DASHBOARD VIEWPORTS -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-5 space-y-5">
    <div id="single-swimmer-view" class="space-y-5"></div>
    <div id="head-to-head-view" class="hidden space-y-5"></div>
  </main>

  <!-- MODAL: ADD NEW SWIMMER -->
  <div id="add-swimmer-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="glass-card rounded-2xl max-w-md w-full p-6 space-y-4 border border-slate-700 shadow-2xl my-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-white font-display font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-user-plus text-emerald-400"></i> Add New Swimmer Profile
        </h3>
        <button onclick="closeAddSwimmerModal()" class="text-slate-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">Full Name *</label>
          <input type="text" id="new-swimmer-name" placeholder="e.g. Leo Chen" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">Current Age</label>
            <input type="number" id="new-swimmer-age" value="11" min="6" max="18" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">Date of Birth</label>
            <input type="date" id="new-swimmer-dob" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">Club / Squad</label>
          <input type="text" id="new-swimmer-club" value="Tanglin Merlions (TTS-VD)" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">Primary Specialty</label>
          <select id="new-swimmer-specialty" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
            <option value="free_sprint">Freestyle Sprint Specialist</option>
            <option value="free_distance">Freestyle Mid/Distance Specialist</option>
            <option value="breast">Breaststroke Specialist</option>
            <option value="fly">Butterfly Specialist</option>
            <option value="back">Backstroke Specialist</option>
            <option value="im">Individual Medley (IM) All-Rounder</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">Profile Accent Color</label>
          <div class="flex items-center gap-3 pt-1">
            <label class="cursor-pointer"><input type="radio" name="swimmer-color" value="#00d2ff" checked class="mr-1"> <span class="text-cyan-400 font-bold">Cyan</span></label>
            <label class="cursor-pointer"><input type="radio" name="swimmer-color" value="#f59e0b" class="mr-1"> <span class="text-amber-400 font-bold">Gold</span></label>
            <label class="cursor-pointer"><input type="radio" name="swimmer-color" value="#10b981" class="mr-1"> <span class="text-emerald-400 font-bold">Emerald</span></label>
            <label class="cursor-pointer"><input type="radio" name="swimmer-color" value="#a855f7" class="mr-1"> <span class="text-purple-400 font-bold">Purple</span></label>
          </div>
        </div>
        <button onclick="saveNewSwimmer()" class="w-full py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-midnight font-extrabold transition">
          Create Swimmer Profile
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL: MANUAL PB ENTRY / OVERRIDE -->
  <div id="manual-pb-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="glass-card rounded-2xl max-w-md w-full p-6 space-y-4 border border-slate-700 shadow-2xl my-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="manual-pb-title" class="text-white font-display font-bold text-base">Add / Override Personal Best</h3>
        <button onclick="closeManualPBModal()" class="text-slate-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="space-y-3 text-xs">
        <input type="hidden" id="manual-pb-index" value="-1">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">Swimmer</label>
          <select id="manual-pb-swimmer" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white"></select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">Event (e.g. 50m Freestyle)</label>
            <input type="text" id="manual-pb-event" placeholder="50m Freestyle" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
          </div>
          <div>
            <label class="block text-[11px] font-bold text-slate-400 mb-1">Course</label>
            <select id="manual-pb-course" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
              <option value="25m SCM">25m SCM</option>
              <option value="50m LCM">50m LCM</option>
              <option value="25y SCY">25y SCY</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">Official Time (mm:ss.ss or ss.ss)</label>
          <input type="text" id="manual-pb-time" placeholder="e.g. 32.82 or 1:14.84" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-cyan-300 font-mono font-bold">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">Meet / Split Note</label>
          <input type="text" id="manual-pb-note" placeholder="e.g. 12th SNSC SCM PB" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white">
        </div>
        <div class="flex items-center gap-2 pt-1">
          <button onclick="saveManualPB()" class="flex-1 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-midnight font-extrabold transition">
            Save Time
          </button>
          <button id="btn-delete-pb" onclick="deleteManualPB()" class="hidden px-3 py-2.5 rounded-xl bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 font-bold transition">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: MEET MOBILE SCREENSHOT OCR SCANNER -->
  <div id="scan-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="glass-card rounded-2xl max-w-lg w-full p-6 space-y-4 border border-slate-700 shadow-2xl my-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 class="text-white font-display font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-images text-cyan-400"></i> Meet Mobile Screenshot OCR Scanner
        </h3>
        <button onclick="closeScanModal()" class="text-slate-400 hover:text-white text-lg">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-[11px] font-bold text-slate-400 mb-1">Target Swimmer</label>
          <select id="field-swimmer" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-white font-bold"></select>
        </div>
        <label class="block p-4 rounded-xl border-2 border-dashed border-cyan-500/40 bg-cyan-950
